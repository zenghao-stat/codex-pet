<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Codex 自定义宠物收藏：查看每个宠物的名字与精灵图。" />
    <title>Codex Pets — 宠物索引</title>
    <style>
      :root {
        --paper: #f5f0e7;
        --paper-deep: #e9dfd0;
        --ink: #1d2633;
        --muted: #68707a;
        --line: rgba(29, 38, 51, 0.16);
        --coral: #e36f52;
        --coral-deep: #bb4d39;
        --blue: #6c8da5;
        --white: #fffaf2;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 18%, rgba(227, 111, 82, 0.12) 0 1px, transparent 1.5px) 0 0 / 24px 24px,
          var(--paper);
        font-family: "Avenir Next", "Trebuchet MS", sans-serif;
      }

      a { color: inherit; }

      .shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 0 24px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 14px;
        height: 14px;
        border-radius: 50% 50% 50% 0;
        background: var(--coral);
        transform: rotate(-45deg);
      }

      nav {
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      nav a { text-decoration: none; }
      nav a:hover { color: var(--coral-deep); }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 0.38fr);
        gap: clamp(32px, 8vw, 100px);
        align-items: end;
        padding: clamp(64px, 10vw, 128px) 0 72px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--coral-deep);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.4rem, 9vw, 8.2rem);
        font-weight: 400;
        letter-spacing: -0.065em;
        line-height: 0.86;
      }

      .hero-note {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.7;
      }

      .collection-line {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
        color: var(--muted);
        font-size: 0.73rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .collection-line::before {
        width: 42px;
        height: 1px;
        background: var(--coral);
        content: "";
      }

      .pet-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 28px;
        padding-bottom: 100px;
      }

      .pet-card {
        position: relative;
        overflow: hidden;
        background: var(--white);
        border: 1px solid var(--line);
        box-shadow: 10px 10px 0 rgba(108, 141, 165, 0.2);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .pet-card:hover {
        transform: translate(-3px, -3px);
        box-shadow: 14px 14px 0 rgba(227, 111, 82, 0.22);
      }

      .sprite-window {
        position: relative;
        display: grid;
        place-items: center;
        aspect-ratio: 192 / 208;
        margin: 18px;
        overflow: hidden;
        background-color: #c9d7dc;
        background-image: var(--sprite);
        background-position: 0 0;
        background-repeat: no-repeat;
        background-size: 800% 1100%;
        border: 1px solid rgba(29, 38, 51, 0.2);
      }

      .sprite-window::after {
        position: absolute;
        inset: 0;
        border: 8px solid rgba(255, 250, 242, 0.22);
        content: "";
        pointer-events: none;
      }

      .card-content {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        padding: 8px 24px 26px;
      }

      .pet-name {
        margin: 0 0 6px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 5vw, 2.8rem);
        font-weight: 400;
        letter-spacing: -0.04em;
      }

      .pet-id {
        margin: 0;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .card-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        color: var(--coral-deep);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .card-link::after { content: "↗"; font-size: 1rem; }
      .card-link:hover { color: var(--ink); }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 20px 0 28px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (max-width: 680px) {
        .shell { width: min(100% - 28px, 520px); }
        header { padding-top: 20px; }
        nav { display: none; }
        .hero { display: block; padding: 72px 0 52px; }
        .hero-note { max-width: 340px; margin-top: 30px; }
        .pet-grid { padding-bottom: 64px; }
        footer { display: block; line-height: 1.8; }
      }

      @media (prefers-reduced-motion: reduce) {
        .pet-card { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="./" aria-label="Codex Pets home">
          <span class="brand-mark" aria-hidden="true"></span>
          Codex Pets
        </a>
        <nav><a href="./README.md">Install guide</a></nav>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <div>
            <p class="eyebrow">A tiny living collection</p>
            <h1 id="page-title">Meet the pets.</h1>
          </div>
          <p class="hero-note">每一只宠物都是一个可安装到 Codex 的 v2 成品。点开卡片，查看完整精灵图；需要安装时，README 里有给 agent 和 human 的指南。</p>
        </section>

        <section aria-labelledby="collection-title">
          <div class="collection-line" id="collection-title">01 / collection</div>
          <div class="pet-grid" id="pet-grid"></div>
        </section>
      </main>

      <footer>
        <span>Codex custom pets · sprite v2</span>
        <span id="pet-count"></span>
      </footer>
    </div>

    <script>
      // 新增宠物时，在这里加入对应的成品目录；目录名必须与 pet.json 的 id 一致。
      const pets = [
        {
          id: "lumei",
          displayName: "噜妹",
          description: "穿粉色蝴蝶结和粉色背带裙的橙黄色水豚女孩，活泼可爱。",
          sprite: "lumei/spritesheet.webp"
        }
      ];

      const grid = document.querySelector("#pet-grid");
      grid.innerHTML = pets.map((pet) => `
        <article class="pet-card">
          <a class="sprite-window" href="${pet.sprite}" style="--sprite: url('${pet.sprite}')" aria-label="查看 ${pet.displayName} 的完整精灵图"></a>
          <div class="card-content">
            <div>
              <h2 class="pet-name">${pet.displayName}</h2>
              <p class="pet-id">${pet.id}</p>
            </div>
            <a class="card-link" href="${pet.sprite}">Spritesheet</a>
          </div>
        </article>
      `).join("");

      document.querySelector("#pet-count").textContent = `${pets.length} pet${pets.length === 1 ? "" : "s"}`;
    </script>
  </body>
</html>
